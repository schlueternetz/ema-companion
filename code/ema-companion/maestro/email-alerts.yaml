# Critical flow: email alerts setup UI (ADR-002).
# Verifies that the Email Alerts level row is present in Settings, that
# selecting "Alerts Only" reveals the setup section with all required fields,
# and that selecting "Off" collapses the section again. Uses clearState to
# ensure the email alert level is Off and no credentials are persisted at the
# start of the flow.
#
# Selectors use resource IDs — the UI labels are localised. The AlertDialog
# list items opened from settings_email_alert_level_row use Android's own
# internal select_dialog_item layout (android:id/text1) for every row, so
# taps disambiguate by index (0=Off, 1=Alerts Only, 2=All) instead of text —
# confirmed via a live uiautomator dump, locale-independent like every other
# selector in this flow.
appId: com.schlueternetz.emacompanion
---
- launchApp:
    clearState: true

# Dismiss the POST_NOTIFICATIONS permission dialog if it appears.
# Same pattern as bottom-nav.yaml — pm clear resets runtime permissions.
# waitForAnimationToEnd gives the permissioncontroller activity time to slide
# in before the when:visible check fires (see bottom-nav.yaml for full rationale).
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_button"

# Wait for the Settings content to be rendered, not just the bottom nav tab.
# settingsFragment (the nav tab id) becomes visible as soon as the nav bar
# appears, which can precede the fragment's ScrollView content rendering.
# setting_ema_app_id is the first item in the Solar Array card — if it's
# visible, the Settings fragment has inflated and is ready to scroll.
- extendedWaitUntil:
    visible:
      id: "setting_ema_app_id"
    timeout: 60000

# The Email Alerts section is below the fold. Scroll it into view before
# asserting so the test works on both phone and tablet form factors.
- scrollUntilVisible:
    element:
      id: "settings_email_alert_level_row"
    direction: DOWN
    timeout: 15000

# Level is Off by default on a fresh install; setup section is hidden.
- assertNotVisible:
    id: "settings_email_alerts_setup_row"

# Select "Alerts Only" (index 1: Off, Alerts Only, All) — setup section must
# appear with all required fields.
- tapOn:
    id: "settings_email_alert_level_row"
- tapOn:
    id: "android:id/text1"
    index: 1
# The setup section expands below the row. Scroll to the save button (the
# last element in the section) so the full expanded form is in the viewport.
- scrollUntilVisible:
    element:
      id: "settings_email_alerts_verify_save"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "settings_email_alerts_setup_row"
- assertVisible:
    id: "settings_email_alerts_open_google_account"
- assertVisible:
    id: "email_address_input"
- assertVisible:
    id: "email_password_input"
- assertVisible:
    id: "settings_email_alerts_verify_save"

# Select "Off" (index 0) — setup section must collapse.
- tapOn:
    id: "settings_email_alert_level_row"
- tapOn:
    id: "android:id/text1"
    index: 0
- assertNotVisible:
    id: "settings_email_alerts_setup_row"
# Let the collapse animation finish and the accessibility driver drain its
# event queue before the next Maestro flow starts. Without this, the driver
# becomes slow under load and inputText in the following flow hits a 120s
# gRPC DEADLINE_EXCEEDED.
- waitForAnimationToEnd:
    timeout: 3000
