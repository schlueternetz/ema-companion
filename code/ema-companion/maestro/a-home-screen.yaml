# Critical flow: Home screen section reachability (ADR-002).
# Named a-home-screen.yaml so it runs first in the suite (alphabetically before
# bottom-nav and email-alerts). Maestro's accessibility driver becomes unresponsive
# to ACTION_SET_TEXT after prior flows stress it with clearState+relaunch cycles;
# running this flow first avoids the gRPC DEADLINE_EXCEEDED.
#
# The Home tab is disabled until the app is configured (isConfigured() requires
# App-ID, App-Secret, System-ID, ECU-ID, and System Capacity to be non-empty).
# This flow fills in the five required fields via the Settings UI, then navigates
# to Home and verifies both tile sections render — today hourly and history —
# each showing its neutral placeholder (dummy, unreachable credentials; no live
# API needed). It then switches to the local ema-api-stub (debug-only "Use local
# stub" action) and its canonical Good Data ECU id, re-opens Home, and asserts
# the same two sections render real, populated data instead.
#
# Field validators (from SettingsFragment):
#   App-ID       [a-zA-Z0-9]{32}
#   App-Secret   [a-zA-Z0-9]{12}
#   System-ID    [a-zA-Z0-9]{16}
#   ECU-ID       \d{12}
#   Capacity     positive decimal ≤ 2 dp
#
# Each edit button is selected via childOf: the row's own id (e.g.
# setting_ema_app_id), not by index — index-based selection broke once a row
# above the target scrolled out of the accessibility tree (off-screen
# SettingRowViews are not guaranteed to still be reported), so childOf scopes
# the search to the specific row regardless of scroll position or ordering.
#
# Selectors use resource IDs (locale-independent).
appId: com.schlueternetz.emacompanion
---
- launchApp:
    clearState: true

# Dismiss the POST_NOTIFICATIONS permission dialog if it appears.
# clearState resets runtime permissions, so the dialog fires on every run.
# waitForAnimationToEnd lets the permissioncontroller activity slide in before
# the when:visible check fires (same pattern as bottom-nav.yaml / email-alerts.yaml).
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "com.android.permissioncontroller:id/permission_allow_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_allow_button"

# Dismiss a system "isn't responding" (ANR) dialog for the launcher/home app if it
# appears. GitHub Actions' shared runners are CPU/RAM constrained enough that the
# Pixel Launcher process can itself ANR on a cold emulator boot — a separate system
# window that covers our already fully-rendered app, so Maestro's visibility checks
# see the dialog instead of our content. "Close app" force-stops only the frozen
# launcher process, not our app (confirmed via CI screenshot: our Settings screen
# was fully rendered underneath).
- runFlow:
    when:
      visible:
        id: "android:id/aerr_close"
    commands:
      - tapOn:
          id: "android:id/aerr_close"

# Wait for Settings content to be ready (first field in the Solar Array card).
- extendedWaitUntil:
    visible:
      id: "setting_ema_app_id"
    timeout: 60000

# ── Fill the five required fields to enable the Home tab ────────────────────

# All-digit values avoid IME autocorrect.
# SettingRowView.exitEditMode() calls hideSoftInputFromWindow() so the keyboard is
# dismissed by the app on every save.
# App-ID — 32 alphanumeric chars
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_ema_app_id"
- assertVisible:
    id: "setting_save_button"
- inputText: "12345678901234567890123456789012"
- tapOn:
    id: "setting_save_button"

# App-Secret — 12 alphanumeric chars
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_ema_app_secret"
- assertVisible:
    id: "setting_save_button"
- inputText: "123456789012"
- tapOn:
    id: "setting_save_button"

# System-ID — 16 alphanumeric chars
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_ema_system_id"
- assertVisible:
    id: "setting_save_button"
- inputText: "1234567890123456"
- tapOn:
    id: "setting_save_button"

# ECU-ID — 12 digits
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_ema_ecu_id"
- assertVisible:
    id: "setting_save_button"
- inputText: "123456789012"
- tapOn:
    id: "setting_save_button"

# System Capacity — positive decimal ≤ 2 dp
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_system_capacity"
- assertVisible:
    id: "setting_save_button"
- inputText: "5"
- tapOn:
    id: "setting_save_button"

# ── Navigate to Home ─────────────────────────────────────────────────────────

# The Home tab is now enabled. Tap it and wait for the first tile to render.
- tapOn:
    id: "homeFragment"
- extendedWaitUntil:
    visible:
      id: "tile_today_production"
    timeout: 15000

# ── Assert both tile sections are present ────────────────────────────────────

# Today section — visible at the top without scrolling (Current Production was
# removed; Today Production is now the first tile).
# With dummy credentials, the fetch fails and the chart renders empty
# (MPAndroidChart shows its own "No chart data available." message).
# hourly_placeholder is only shown in the never-fetched state; once a
# fetch is attempted the chart becomes visible regardless of result.
# The fetch itself (which must first time out against an unreachable dummy
# host) now runs inside a WorkManager-dispatched ApiSyncWorker rather than a
# Fragment-scoped coroutine (ADR-010) — HomeFragment re-binds via an
# observeCompletion() Flow collector, an extra hop on top of the same network
# timeout that already made a bare assertVisible unreliable elsewhere in this
# flow (see the "0.42" check below). extendedWaitUntil for the same reason.
- assertVisible:
    id: "tile_today_production"
- extendedWaitUntil:
    visible:
      id: "hourly_chart"
    timeout: 20000

# History section — scroll further and assert the card and the chart.
# Scrolling to tile_module_health (the row BELOW tile_history_production) rather
# than tile_history_production itself is deliberate: scrollUntilVisible can stop
# as soon as the target is only barely peeking onto screen (same class of bug
# fixed for setting_ema_ecu_id below — observed in CI: tile_history_production's
# own reported bounds were just 2px tall, clipping its child history_chart out of
# the accessibility tree entirely). Scrolling one row further guarantees the whole
# History card lands solidly mid-viewport instead of edge-clipped.
- scrollUntilVisible:
    element:
      id: "tile_module_health"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "tile_history_production"
- extendedWaitUntil:
    visible:
      id: "history_chart"
    timeout: 20000

# ── Point at the local stub and switch to the stub's canonical Good Data ECU ─
# Extends the flow (dev-stub-shortcut) to also verify real, populated data
# renders — not just the placeholder/error path the dummy credentials above
# exercise. App-ID/App-Secret/System-ID stay at their dummy values: the stub
# wildcards sid and never verifies HMAC signing, so only the ECU-ID needs to
# match the bundled Good Data scenario.
- tapOn:
    id: "settingsFragment"
- extendedWaitUntil:
    visible:
      id: "setting_ema_app_id"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "setting_use_local_stub"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "setting_use_local_stub"

# ECU-ID — replace the dummy value with the stub's Good Data id.
# Scroll back up: the Use local stub tap above left the API Settings card
# (further down the page) in view, but the ECU-ID edit button lives in the
# Solar Array Settings card above it. Scrolling to setting_ema_app_id (the
# TOP of that card) rather than setting_ema_ecu_id itself is deliberate:
# scrollUntilVisible can stop as soon as the target is only barely peeking
# onto screen (observed in CI: setting_ema_ecu_id's own reported bounds were
# just 9px tall, clipping its child edit button out of the accessibility
# tree entirely). Scrolling further, to the row above it, guarantees the
# whole card — including ECU-ID — lands solidly mid-viewport instead of
# edge-clipped.
- scrollUntilVisible:
    element:
      id: "setting_ema_app_id"
    direction: UP
    timeout: 10000
- tapOn:
    id: "setting_edit_button"
    childOf:
      id: "setting_ema_ecu_id"
- assertVisible:
    id: "setting_save_button"
- eraseText: 50
- inputText: "203000001234"
- tapOn:
    id: "setting_save_button"

# ── Re-open Home and assert real, populated data renders ─────────────────────
- tapOn:
    id: "homeFragment"
- extendedWaitUntil:
    visible:
      id: "tile_today_production"
    timeout: 15000
# tile_today_production is visible immediately (seeded from persisted state in
# onViewCreated), but the hour-06 value "0.42" (from the stub's Good Data hourly
# fixture, 203000001234.json) only appears after onResume's async refresh() completes
# a real HTTP round-trip to the stub. assertVisible's default 7s timeout races that
# fetch under CI load; extendedWaitUntil gives it room like the other checks below.
# 15s was borderline on GitHub Actions' shared runners (observed a 1m41s total flow
# duration vs ~70-90s healthy — the fetch was landing just past the old window, not
# hanging), so this one gets more margin than the others.
- extendedWaitUntil:
    visible:
      text: "0.42"
    timeout: 30000
- assertVisible:
    id: "hourly_chart"

# Same edge-clipping avoidance as above: scroll to tile_module_health (the row
# below), not tile_history_production itself.
- scrollUntilVisible:
    element:
      id: "tile_module_health"
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "history_chart"
    timeout: 20000
