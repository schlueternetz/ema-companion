name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same ref supersedes an in-progress run — don't burn
# Actions minutes (and an emulator) on commits that are already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code/ema-companion

jobs:
  unit:
    name: Unit + Robolectric + ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit + Robolectric tests and ktlint
        run: ./gradlew testDebugUnitTest ktlintCheck

  e2e:
    name: Maestro E2E (emulator)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Hardware acceleration for the Android emulator (ubuntu-latest has KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        working-directory: .

      - name: Make ema-api-stub gradlew executable
        run: chmod +x ./gradlew
        working-directory: code/ema-api-stub

      # Starts the stub on the runner host (default port 8080, matching the app's
      # BuildConfig.STUB_PORT default) in the background, then polls until it
      # responds — the a-home-screen.yaml flow drives the emulator at 10.0.2.2,
      # which maps back to this host. A stub that never comes up fails the job
      # loudly here instead of Maestro racing an unready server later.
      - name: Start ema-api-stub
        working-directory: code/ema-api-stub
        run: |
          ./gradlew run > /tmp/ema-api-stub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -X POST "http://localhost:8080/__stub__/reset" >/dev/null 2>&1; then
              echo "ema-api-stub is up"
              exit 0
            fi
            sleep 2
          done
          echo "ema-api-stub did not become ready in time"
          cat /tmp/ema-api-stub.log
          exit 1

      # Boots an API-33 emulator (matches the Lenovo_Tab_11_Plus AVD / test sdk),
      # installs the debug APK, then runs the Maestro flows black-box.
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          working-directory: code/ema-companion
          # Flow order is explicit, not directory order: `maestro test maestro/` iterates
          # whatever order the filesystem returns, which is alphabetical on Windows/NTFS
          # (where these flows were authored) but arbitrary on Linux/ext4 (this runner) —
          # a-home-screen.yaml is written to run first (see its header comment) to avoid
          # the accessibility driver degrading after other flows' clearState+relaunch
          # cycles, so pin that order here rather than trust directory listing.
          script: |
            ./gradlew installDebug
            maestro test maestro/a-home-screen.yaml maestro/bottom-nav.yaml maestro/email-alerts.yaml
